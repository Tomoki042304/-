<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f9f7f3">
<title>アプリ登録へ進む | IKIGAIアカデミー</title>
<style>
:root{color-scheme:light;--wine:#690817;--ink:#291b1e;--muted:#77686b;--paper:#f9f7f3}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;min-height:100svh;display:grid;place-items:center;padding:48px 24px}
main{width:100%;max-width:480px;text-align:center}.brand{margin:0 0 72px;font:400 27px/1.5 Georgia,"Times New Roman",serif;letter-spacing:.23em;color:var(--wine)}.brand small{display:block;font-size:10px;letter-spacing:.4em;margin-top:4px}
.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--muted);margin:0 0 20px}h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(24px,6vw,32px);line-height:1.65;font-weight:500;margin:0 0 22px;letter-spacing:.06em}.rule{width:36px;height:1px;background:var(--wine);margin:0 auto 26px}.copy{font-size:14px;line-height:2;color:var(--muted);margin:0 0 36px}
.action{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:62px;padding:18px 24px;border-radius:4px;background:var(--wine);color:white;text-decoration:none;font-size:15px;font-weight:600;line-height:1.6}.action:focus-visible{outline:3px solid #caa767;outline-offset:5px}.action:active{background:#490611}.arrow{font-size:23px;font-weight:400}.hint{margin:20px 0 0;font-size:12px;line-height:1.9;color:var(--muted)}footer{margin-top:72px;font:10px Georgia,serif;letter-spacing:.17em;color:var(--muted)}
@media(prefers-reduced-motion:no-preference){.action{transition:background .15s}}
</style>
</head>
<body>
<main>
 <p class="brand">IKIGAI<small>ACADEMY</small></p>
 <p class="eyebrow">APP REGISTRATION</p>
 <h1>次は、アプリへ。</h1>
 <div class="rule" aria-hidden="true"></div>
 <p class="copy">LINEでログインして、<br>アプリの登録を完了してください。</p>
 <a class="action" href="https://liff.line.me/2012617316-f4FBapHK">アプリ登録へ進む<span class="arrow" aria-hidden="true">→</span></a>
 <p class="hint">登録済みの方は、同じLINEアカウントでお進みください。</p>
 <footer>IKIGAI ACADEMY</footer>
</main>
</body>
</html>
